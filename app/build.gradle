plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.wizzcraft.ima'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wizzcraft.ima'
        minSdk 30
        targetSdk 35
        // Each workflow counts its runs from 1; the offset keeps every new build installable over
        // the builds already on phones (0.1.x used the bare run number).
        versionCode 1000 + runNumber
        versionName "0.2.0-preview"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
