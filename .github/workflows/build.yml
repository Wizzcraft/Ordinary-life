name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Checks (unit tests, minigame gate, full-game sim)
        # A red check stops the job here: no APK is built or published from a broken tree.
        run: bash tools/check.sh
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ima-al-hakav.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ima-al-hakav
          path: ima-al-hakav.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ima-al-hakav.apk \
            --title "Latest build" \
            --notes "Automated build from ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
